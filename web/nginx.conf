server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API calls, so the UI needs no CORS (mirrors the Vite dev proxy).
    location /messages { proxy_pass http://api:8080; }
    location /health   { proxy_pass http://api:8080; }

    location / { try_files $uri /index.html; }
}
