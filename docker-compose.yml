services:
  api:
    build:
      context: .
      dockerfile: src/Sms.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__Sms: "Data Source=/data/sms.db"
      # The supplied mock provider runs on the host; override with SMS_PROVIDER_URL if it runs elsewhere.
      SmsProvider__BaseUrl: "${SMS_PROVIDER_URL:-http://host.docker.internal:5005}"
      Seed__EmployeesFile: "/app/seed/employees.json"
    extra_hosts:
      - "host.docker.internal:host-gateway" # makes host.docker.internal work on Linux too
    volumes:
      - sms-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sms-data:
